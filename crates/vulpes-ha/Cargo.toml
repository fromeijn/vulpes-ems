[package]
name = "vulpes-ha"
description = "Home Assistant adapter: settings, input parsing, control commands and setup forms for the vulpes-ems integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror.workspace = true
vulpes-core.workspace = true
vulpes-engine.workspace = true
vulpes-price = { version = "0.5.0", path = "../vulpes-price" }
