[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "vulpes-ems"
description = "Home energy management core: solar/load/price forecasting and ESS mode optimization"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "vulpes_ems._core"
features = ["pyo3/extension-module"]
