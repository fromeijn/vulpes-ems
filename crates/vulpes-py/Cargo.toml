[package]
name = "vulpes-py"
description = "Python bindings for vulpes-ems"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py313"] }
vulpes-core.workspace = true
vulpes-engine = { version = "0.3.0", path = "../vulpes-engine" }
vulpes-opt.workspace = true
vulpes-sources = { version = "0.3.0", path = "../vulpes-sources" }
