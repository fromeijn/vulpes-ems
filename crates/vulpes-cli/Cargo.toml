[package]
name = "vulpes-cli"
description = "Command-line tools for backtesting and replay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
vulpes-core = { version = "0.4.0", path = "../vulpes-core" }
vulpes-engine = { version = "0.4.0", path = "../vulpes-engine" }
vulpes-load = { version = "0.4.0", path = "../vulpes-load" }
vulpes-ml = { version = "0.4.0", path = "../vulpes-ml" }
vulpes-opt.workspace = true
vulpes-price = { version = "0.4.0", path = "../vulpes-price" }
vulpes-solar = { version = "0.4.0", path = "../vulpes-solar" }
vulpes-sources = { version = "0.4.0", path = "../vulpes-sources" }
