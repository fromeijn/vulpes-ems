name: wheels
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        # manylinux_2_28 (GCC 12): ring's aarch64 assembly does not build with
        # the manylinux2014 cross toolchain. musllinux is what HA OS/Container use.
        manylinux: ["2_28", musllinux_1_2]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m crates/vulpes-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist
  # Each wheel on its own architecture: Alpine (musl) as Home Assistant OS and
  # Container run it, Debian (glibc) for the manylinux wheels.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        manylinux: ["2_28", musllinux_1_2]
        include:
          - { target: x86_64, runner: ubuntu-latest }
          - { target: aarch64, runner: ubuntu-24.04-arm }
          - { manylinux: "2_28", image: "python:3.14-slim" }
          - { manylinux: musllinux_1_2, image: "python:3.14-alpine" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "wheel-${{ matrix.target }}-${{ matrix.manylinux }}", path: dist }
      # docker run rather than `container:`: JavaScript actions such as checkout
      # don't run inside an Alpine container on the arm64 runners.
      # Binding and integration-logic tests against the installed wheel, as Home Assistant uses it.
      - run: >-
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c
          'pip install dist/*.whl pytest
          && python -c "import vulpes_ems; print(vulpes_ems.__version__)"
          && python -m pytest -q -p no:cacheprovider tests'
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: wheel-*, merge-multiple: true, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
