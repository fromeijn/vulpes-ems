name: wheels
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
        manylinux: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m crates/vulpes-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist
  smoke:
    needs: build
    runs-on: ubuntu-latest
    container: python:3.14-alpine
    steps:
      - uses: actions/download-artifact@v4
        with: { name: wheel-x86_64-musllinux_1_2, path: dist }
      - run: pip install dist/*.whl && python -c "import vulpes_ems; print(vulpes_ems.__version__)"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: wheel-*, merge-multiple: true, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
